[project]
name = "schema-review-mcp"
version = "0.1.0"
description = "MCP server for the schema-review Claude Code plugin"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
schema-review-mcp = "schema_review.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
